<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0b">
<title>ODA SHOP - Gestion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--y:#F5B800;--y2:#FFD84D;--g:rgba(255,255,255,.06);--gb:rgba(255,216,77,.18)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#0b0b0b radial-gradient(120% 60% at 50% -10%,#2b2208 0%,#0b0b0b 60%) no-repeat;color:#f2f2f2;max-width:520px;margin:0 auto;padding:0 12px 96px;min-height:100vh;font-size:14px}
header{position:sticky;top:0;z-index:10;background:rgba(11,11,11,.92);backdrop-filter:blur(10px);padding:10px 0 6px;border-bottom:1px solid var(--gb)}
.top{display:flex;align-items:center;gap:10px}
.logo{height:38px;max-width:110px;object-fit:contain}
.ttl{flex:1;min-width:0}
h1{font-size:15px;font-weight:800;color:var(--y2);line-height:1.1}
.who{font-size:10.5px;color:#9a9a9a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg{background:var(--g);border:1px solid var(--gb);color:#eee;border-radius:14px;padding:6px 11px;font-size:11.5px;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 12px;border-radius:18px;border:1px solid var(--gb);background:var(--g);color:#ddd;font-size:12px;font-weight:600;white-space:nowrap}
.tab.on{background:linear-gradient(180deg,var(--y2),var(--y));color:#111;border-color:var(--y);font-weight:800}
.srch{width:100%;margin-top:8px;height:38px;border-radius:12px;border:1px solid var(--gb);background:var(--g);color:#fff;padding:0 12px;font-size:14px}
.it{display:flex;gap:10px;background:var(--g);border:1px solid var(--gb);border-radius:16px;padding:10px;margin-top:10px;backdrop-filter:blur(6px);cursor:pointer}
.it:active{transform:scale(.99)}
.th{width:66px;height:66px;border-radius:12px;object-fit:cover;flex:none;background:#1c1c1c;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.in{flex:1;min-width:0}
.in b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{color:var(--y2);font-weight:800;font-size:13px;margin-top:2px}
.code{display:inline-block;background:var(--y);color:#111;font-weight:800;font-size:11px;border-radius:7px;padding:2px 7px;margin-top:4px;letter-spacing:.3px}
.sub{color:#9a9a9a;font-size:11px;margin-left:6px}
.chev{align-self:center;color:var(--y2);font-size:20px}
.empty{text-align:center;color:#888;padding:46px 10px;font-size:13px;line-height:1.6}
.fab{position:fixed;right:max(14px,calc(50vw - 246px));bottom:18px;z-index:20;background:linear-gradient(180deg,var(--y2),var(--y));color:#111;border:0;border-radius:28px;padding:14px 22px;font-weight:800;font-size:14px;box-shadow:0 8px 22px rgba(245,184,0,.4)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.box{background:#151515;border-top:2px solid var(--y);border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:93vh;overflow:auto;padding:16px 16px 22px}
.box h2{font-size:15px;color:var(--y2);margin-bottom:6px}
label{display:block;font-size:11.5px;color:#aaa;margin:11px 0 4px}
input,select,textarea{width:100%;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:11px;padding:10px;font-size:14px;font-family:inherit}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button,.btns a{flex:1;padding:12px;border-radius:12px;border:0;font-weight:800;font-size:14px;text-align:center;text-decoration:none;display:block}
.ok{background:linear-gradient(180deg,var(--y2),var(--y));color:#111}
.no{background:#2a2a2a;color:#ddd}
.del{background:#3a1717;color:#ff8a8a;border:1px solid #6a2a2a!important}
.wa{background:#1f9d55;color:#fff}.call{background:#2a2a2a;color:#fff}
.pick{display:flex;gap:10px;align-items:center;margin-top:4px}
.pick label.p{margin:0;flex:1;text-align:center;border:1.5px dashed #666;border-radius:12px;padding:14px 8px;color:#ddd;font-size:12.5px}
.pick img,.pick video{width:74px;height:74px;border-radius:12px;object-fit:cover;background:#222}
.ths{display:flex;gap:8px;flex-wrap:wrap}.ths:empty{display:none}
.tb{position:relative;width:68px;height:68px}.tb img{width:100%;height:100%;border-radius:10px;object-fit:cover;background:#222}
.tb b{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#c0392b;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;line-height:1}
.tb i{position:absolute;left:4px;bottom:4px;background:var(--y);color:#111;font-size:9px;font-style:normal;font-weight:800;border-radius:5px;padding:1px 5px}
.msg{font-size:12px;color:#ff8a8a;margin-top:10px;min-height:16px}
.bar{height:6px;background:#2a2a2a;border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--y)}
.media{width:100%;border-radius:14px;max-height:280px;object-fit:cover;background:#000;margin:6px 0 4px}
.dc{font-size:20px;font-weight:800;margin:6px 0 2px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #262626;font-size:13px}
.kv span:first-child{color:#9a9a9a;flex:none}.kv span:last-child{text-align:right;word-break:break-word}
.vend{background:rgba(245,184,0,.08);border:1px solid var(--gb);border-radius:14px;padding:4px 12px 12px;margin-top:12px}
.vend h3{font-size:12px;color:var(--y2);margin:10px 0 0;text-transform:uppercase;letter-spacing:.5px}
.vend .btns{margin-top:10px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;border:1px solid #444;border-radius:14px;padding:10px 16px;font-size:13px;opacity:0;transition:opacity .25s;z-index:99;pointer-events:none;max-width:90%;text-align:center}

/* === Disposition de l'espace admin de référence === */
.top{justify-content:space-between}
.ab{color:var(--y2);font-weight:800;font-size:13px;letter-spacing:1.6px;white-space:nowrap}
.who{display:none}
.lg{border-radius:10px;font-size:11px;padding:6px 10px}
.tabs{padding:10px 0 8px}
.tab{padding:8px 13px;border-radius:20px;font-size:11.5px;background:rgba(255,255,255,.05)}
.sw{position:relative}.sw span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.7}
.srch{height:44px;border-radius:14px;padding:0 14px 0 40px;margin-top:2px}
#actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.ab1{flex:1;min-width:46%;height:46px;border-radius:14px;border:1.5px solid var(--y);background:linear-gradient(180deg,var(--y2),var(--y));color:#111;font-weight:800;font-size:12px;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;transition:transform .12s}
.ab1.o{background:transparent;color:var(--y2)}
.ab1:active{transform:scale(.97)}
.reg{text-align:center;color:#8a8a8a;font-size:10.5px;margin:8px 0 2px}
#liste{position:relative;min-height:46vh}
#liste::before{content:"";position:absolute;inset:0;background:var(--wm) center 30%/78% no-repeat;opacity:.07;filter:grayscale(1) invert(1);pointer-events:none}
#liste>*{position:relative}
.empty.z{border:1px solid var(--gb);border-radius:16px;background:rgba(255,255,255,.03);padding:22px 10px;margin-top:12px;color:#aaa}
.out{display:block;width:100%;margin:18px 0 8px;height:44px;border-radius:14px;border:1px solid rgba(255,90,90,.45);background:rgba(255,255,255,.03);color:#ff6b6b;font-weight:700;font-size:13px}
.out[hidden]{display:none}
.fab{display:none!important}
@media(min-width:900px){body{max-width:560px}}
</style>
</head>
<body>
<header>
  <div class="top"><img class="logo" id="logo" alt="ODA SHOP" hidden><div class="ab">⚙️ ADMIN AGADEZ</div><div class="who" id="who">Chargement...</div><button class="lg" id="lg" type="button">Se connecter</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="sw"><span>🔍</span><input class="srch" id="q" type="search" placeholder="Rechercher (code, nom ou identification)..." autocomplete="off"></div>
</header>
<div id="actions"></div>
<div class="reg">Région Agadez — vos ajouts sont limités à cette région.</div>
<main id="liste"></main>
<button class="out" id="out" type="button" hidden>⎋ Se déconnecter</button>

<!-- Détail d'un produit -->
<div class="sheet" id="ds" hidden><div class="box" id="db"></div></div>

<!-- Ajout -->
<div class="sheet" id="fs" hidden><div class="box">
  <h2 id="fh">Ajouter une annonce</h2>
  <label>Service</label><select id="fsec"></select>
  <div id="tbox"><label>Type d'annonce *</label><select id="ftyp"><option value="">Choisis...</option><option value="terrain">🏞️ Acheter un terrain</option><option value="location">🏠 Maison à louer</option></select></div>
  <label id="fnl">Nom *</label><input id="fnom" placeholder="Ex : Bouilloire électrique 1.7L">
  <label id="fpl">Prix de vente (FCFA) *</label><input id="fvente" type="number" inputmode="numeric" placeholder="18000">
  <label id="fdl">Description (facultatif)</label><textarea id="fdesc" placeholder="Ex : Neuf, garantie 1 an"></textarea>
  <label id="fpt">Photos (jusqu'à 6, la 1re est la photo principale)</label>
  <div class="ths" id="ths"></div>
  <div class="pick"><label class="p" for="ffile">📷 Ajouter des photos (appuie plusieurs fois pour en ajouter d'autres)</label></div>
  <input type="file" id="ffile" accept="image/*" multiple hidden>
  <div id="vbox"><label>Vidéo</label>
  <div class="pick"><video id="vv" muted playsinline hidden></video><label class="p" for="fvf">🎬 Choisir une vidéo (40 Mo max)</label></div>
  <input type="file" id="fvf" accept="video/*" hidden></div>
  <label id="fvl">Vendeur</label><input id="fven" placeholder="Nom du vendeur">
  <label id="ftl">Téléphone du vendeur</label><input id="ftel" type="tel" placeholder="90 00 00 00">
  <div style="font-size:10.5px;color:#8a8a8a;margin-top:4px">🔒 Nom et téléphone ne sont visibles que dans cette page, jamais par les clients.</div>
  <div class="bar" id="bar" hidden><i id="bari"></i></div>
  <div class="msg" id="fmsg"></div>
  <div class="btns"><button class="no" id="fno" type="button">Annuler</button><button class="ok" id="fok" type="button">Enregistrer</button></div>
</div></div>

<!-- Connexion -->
<div class="sheet" id="ls" hidden><div class="box">
  <h2>Connexion administrateur</h2>
  <label>E-mail</label><input id="lmail" type="email" autocomplete="username">
  <label>Mot de passe</label><input id="lpass" type="password" autocomplete="current-password">
  <div class="msg" id="lmsg"></div>
  <div class="btns"><button class="no" id="lno" type="button">Fermer</button><button class="ok" id="lok" type="button">Se connecter</button></div>
</div></div>
<div class="toast" id="toast"></div>

async function api(path,opt){
  const r=await fetch(URL_+path,opt);
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}
    if(r.status===401||r.status===403||/row-level security|permission denied|jwt/i.test(m))throw new Error("Accès refusé : connecte-toi en administrateur");
    throw new Error(m||('Erreur '+r.status))}
  return r.status===204?null:r.json().catch(()=>null);
}
function head(){$('who').textContent=tok?('Connecté : '+mail):'Non connecté';$('lg').textContent=tok?'Déconnexion':'Se connecter';$('out').hidden=!tok}
const tel=p=>String(p||'').replace(/\D/g,'');
const telWa=p=>{const d=tel(p);return d.length===8?'227'+d:d};

// ===== Liste =====
async function charger(){
  if(!tok){items=[];afficher();return}
  try{items=await api('/rest/v1/products?select=*&order=created_at.desc&limit=1000',{headers:H()})||[]}
  catch(e){items=[];$('liste').innerHTML='<div class="empty">⚠️ '+esc(e.message)+'</div>';if(/connecte-toi/i.test(e.message)){tok=null;try{localStorage.removeItem('oda_admin')}catch(x){}head();ouvrirLogin()}return}
  afficher();
}
const ACT={boutique:[['+ Ajouter produit neuf']],marketplace:[['+ Ajouter annonce occasion']],vivrier:[['+ Ajouter produit vivrier']],
 immobilier:[['+ Terrain à vendre','terrain'],['+ Maison à louer','location']],travaux:[['+ Ajouter un artisan']],colis:[['+ Ajouter une offre colis']],transport:[['+ Ajouter un transport']]};
function afficher(){
  $('tabs').innerHTML=SECTIONS.map(s=>`<button class="tab${s.k===tab?' on':''}" data-t="${s.k}">${s.e} ${s.t} (${items.filter(p=>p.section===s.k).length})</button>`).join('');
  const S=SECTIONS.find(s=>s.k===tab);
  $('actions').innerHTML=tok?(ACT[tab]||[['+ Ajouter']]).map((a,i)=>'<button class="ab1'+(i?' o':'')+'" data-add="'+tab+'" data-typ="'+(a[1]||'')+'" type="button">'+a[0]+'</button>').join(''):'<button class="ab1" data-login="1" type="button">Se connecter</button>';
  if(!tok){$('liste').innerHTML='<div class="empty">🔒<br>Connecte-toi pour gérer les produits.</div>';return}
  const q=$('q').value.trim().toLowerCase();
  // la recherche par code ou par téléphone cherche dans tous les services
  const l=items.filter(p=>q?((p.name||'')+' '+(p.code||'')+' '+(p.seller_name||'')+' '+(p.seller_phone||'')).toLowerCase().includes(q):p.section===tab);
  $('liste').innerHTML=l.length?l.map(p=>{
    const T=SECTIONS.find(s=>s.k===p.section)||S,img=p.photo||p.image_url;
    return `<div class="it" data-id="${esc(p.id)}">${img?`<img class="th" src="${esc(img)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=th>${T.e}</div>'">`:`<div class="th">${p.video_url?'🎬':T.e}</div>`}
    <div class="in"><b>${esc(p.name)}</b><div class="pr">${prixTxt(p)}</div><span class="code">${esc(p.code||'—')}</span>${q?'<span class="sub">'+T.t+'</span>':''}</div><div class="chev">›</div></div>`}).join('')
    :'<div class="empty z">'+(q?'Aucun résultat.':'Aucune marchandise')+'</div>';
}
$('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;$('q').value='';afficher()}};
$('q').oninput=afficher;

// ===== Détail =====
$('liste').onclick=e=>{const c=e.target.closest('[data-id]');if(c)ouvrirDetail(c.dataset.id)};
function kv(a,b){return b?`<div class="kv"><span>${a}</span><span>${esc(b)}</span></div>`:''}
function ouvrirDetail(id){
  const p=items.find(x=>String(x.id)===String(id));if(!p)return;
  const T=SECTIONS.find(s=>s.k===p.section)||{t:p.section,e:'🛍️'},img=p.photo||p.image_url;
  const ph=(Array.isArray(p.photos)&&p.photos.length?p.photos:[img]).filter(Boolean);
  const media=p.video_url?`<video class="media" src="${esc(p.video_url)}" ${img?'poster="'+esc(img)+'"':''} controls playsinline preload="metadata"></video>`:(ph.length?`<div style="display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory">${ph.map(u=>`<img class="media" style="flex:0 0 ${ph.length>1?'88%':'100%'};scroll-snap-align:center" src="${esc(u)}" alt="">`).join('')}</div>`:'');
  const d=p.created_at?new Date(p.created_at).toLocaleDateString('fr-FR'):'';
  $('db').innerHTML=media+`<span class="code" style="font-size:13px">${esc(p.code||'—')}</span><div class="dc">${esc(p.name)}</div><div class="pr" style="font-size:16px">${prixTxt(p)}</div>
  ${kv('Service',T.e+' '+T.t)}${kv('Type',p.sous_categorie==='terrain'?'Acheter un terrain':p.sous_categorie==='location'?'Maison à louer':'')}${kv('Description',p.description)}${kv('Ajouté le',d)}
  <div class="vend"><h3>🔒 Vendeur (privé)</h3>${kv('Nom',p.seller_name||'—')}${kv('Téléphone',p.seller_phone||'—')}
  ${tel(p.seller_phone)?`<div class="btns"><a class="call" href="tel:${tel(p.seller_phone)}">📞 Appeler</a><a class="wa" href="https://wa.me/${telWa(p.seller_phone)}" target="_blank" rel="noopener">WhatsApp</a></div>`:''}</div>
  <div class="btns"><button class="ok" id="dmod" type="button">✏️ Modifier</button><button class="del" id="ddel" type="button">Supprimer</button></div><div class="btns" style="margin-top:8px"><button class="no" id="dno" type="button">Fermer</button></div>`;
  $('ds').hidden=false;
  $('dno').onclick=fermerDetail;
  $('ddel').onclick=()=>supprimer(p);
  $('dmod').onclick=()=>{fermerDetail();ouvrirForm(p)};
}
function fermerDetail(){const v=$('db').querySelector('video');if(v)v.pause();$('ds').hidden=true}
$('ds').onclick=e=>{if(e.target===$('ds'))fermerDetail()};
async function supprimer(p){
  if(!confirm('Supprimer « '+p.name+' » ('+(p.code||'')+') ?\nCette action est définitive.'))return;
  try{
    await api('/rest/v1/products?id=eq.'+encodeURIComponent(p.id),{method:'DELETE',headers:H({Prefer:'return=minimal'})});
    items=items.filter(x=>x.id!==p.id);fermerDetail();afficher();toast('🗑️ '+(p.code||'Annonce')+' supprimée');
    // on libère aussi l'espace sur Cloudflare (sans bloquer si ça échoue)
    [p.photo,p.image_url,p.video_url].filter(u=>u&&u.startsWith(R2_BASE)).forEach(u=>fetch(CF_UPLOAD_URL+'?key='+encodeURIComponent(u.slice(R2_BASE.length)),{method:'DELETE',headers:{Authorization:'Bearer '+tok}}).catch(()=>{}));
  }catch(err){toast('⚠️ '+err.message,4000);if(/connecte-toi/i.test(err.message))ouvrirLogin()}
}

// ===== Ajout =====
function majForm(){
  const S=SECTIONS.find(s=>s.k===$('fsec').value)||SECTIONS[0];
  $('fnl').textContent=S.nl;$('fnom').placeholder=S.np;$('fpl').textContent=S.pl;$('fdl').textContent=S.dl;$('fdesc').placeholder=S.dp;
  $('fvl').textContent=S.v;$('ftl').textContent=S.tl;$('tbox').style.display=S.vid?'':'none';$('vbox').style.display=S.vid?'':'none';
  $('fpt').textContent=S.max>1?"Photos (jusqu'à "+S.max+", la 1re est la photo principale)":'Photo';
}
let edit=null; // annonce en cours de modification (null = nouvelle)
function ouvrirForm(p){
  edit=p||null;
  $('fsec').innerHTML=SECTIONS.map(s=>`<option value="${s.k}">${s.e} ${s.t}</option>`).join('');$('fsec').value=edit?edit.section:tab;majForm();
  $('fh').textContent=edit?'Modifier '+(edit.code||'l\'annonce'):'Ajouter une annonce';$('fok').textContent=edit?'Enregistrer les changements':'Enregistrer';
  $('ftyp').value=edit?edit.sous_categorie||'':'';$('fnom').value=edit?edit.name||'':'';$('fvente').value=edit&&Number(edit.sell_price||edit.price)>0?(edit.sell_price||edit.price):'';
  $('fdesc').value=edit?edit.description||'':'';$('fven').value=edit?edit.seller_name||'':'';$('ftel').value=edit?edit.seller_phone||'':'';
  videoFile=null;$('ffile').value='';$('fvf').value='';$('fmsg').textContent='';$('bar').hidden=true;
  photoList=edit?((Array.isArray(edit.photos)&&edit.photos.length?edit.photos:[edit.photo||edit.image_url]).filter(Boolean).map(url=>({url}))):[];majThumbs();
  $('vv').hidden=!(edit&&edit.video_url);if(edit&&edit.video_url)$('vv').src=edit.video_url;
  $('fs').hidden=false;
}
$('fsec').onchange=majForm;$('fsec').disabled=false;
$('actions').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.login||!tok){ouvrirLogin();return}tab=b.dataset.add;ouvrirForm();if(b.dataset.typ){$('ftyp').value=b.dataset.typ}};
$('fno').onclick=()=>$('fs').hidden=true;
const curS=()=>SECTIONS.find(s=>s.k===$('fsec').value)||SECTIONS[0];
function majThumbs(){
  $('ths').innerHTML=photoList.map((x,i)=>`<div class="tb"><img src="${esc(x.url||x.prev)}" alt="">${i===0?'<i>PRINCIPALE</i>':''}<b data-rm="${i}">×</b></div>`).join('');
}
$('ths').onclick=e=>{const b=e.target.closest('[data-rm]');if(b){photoList.splice(+b.dataset.rm,1);majThumbs()}};
function reduire(f){ // photo réduite à 900 px pour économiser les données
  return new Promise((ok,ko)=>{const img=new Image(),u=URL.createObjectURL(f);
    img.onload=()=>{const r=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);ok(b)},'image/jpeg',.8)};
    img.onerror=()=>ko(new Error('Photo illisible'));img.src=u})
}
$('ffile').onchange=async e=>{
  const fs=[...e.target.files];e.target.value='';
  for(const f of fs){if(photoList.length>=(curS().max||6)){$('fmsg').textContent=(curS().max||6)+' photos maximum pour ce service.';break}
    try{const b=await reduire(f);photoList.push({blob:b,prev:URL.createObjectURL(b)})}catch(err){$('fmsg').textContent='Une photo est illisible, essaie une autre.'}}
  majThumbs();
};
$('fvf').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  if(f.size>40*1024*1024){$('fmsg').textContent='Vidéo trop lourde (40 Mo max).';e.target.value='';return}
  videoFile=f;$('vv').src=URL.createObjectURL(f);$('vv').hidden=false;$('fmsg').textContent='';
};
function envoyer(blob,type,label){ // envoi vers Cloudflare avec barre de progression
  return new Promise((ok,ko)=>{
    const x=new XMLHttpRequest();x.open('POST',CF_UPLOAD_URL);x.setRequestHeader('Content-Type',type);x.setRequestHeader('Authorization','Bearer '+tok);
    $('bar').hidden=false;$('bari').style.width='0';
    x.upload.onprogress=e=>{if(e.lengthComputable){$('bari').style.width=Math.round(e.loaded/e.total*100)+'%';$('fmsg').textContent=label+' '+Math.round(e.loaded/e.total*100)+'%'}};
    x.onload=()=>{if(x.status>=200&&x.status<300){try{const u=JSON.parse(x.responseText).url;u?ok(u):ko(new Error("Cloudflare n'a pas renvoyé le lien"))}catch(e){ko(new Error('Réponse Cloudflare invalide'))}}
      else{let m='';try{m=JSON.parse(x.responseText).error||''}catch(e){}ko(new Error(m||('Envoi vers Cloudflare impossible ('+x.status+')')))}};
    x.onerror=async()=>{ // on interroge le Worker pour dire précisément ce qui ne va pas
      try{const r=await fetch(CF_UPLOAD_URL);const j=await r.json();
        ko(new Error(j.bucket===false?"Le Worker n'est pas relié au bucket : Cloudflare > Worker oda-photos > Paramètres > Reliures > Bucket R2, nom BUCKET":"Le Worker répond mais l'envoi a échoué (fichier trop lourd ? réessaie avec moins de photos)"))}
      catch(e){ko(new Error("Impossible de joindre le Worker (connexion coupée ou Worker non déployé)"))}};
    x.send(blob);
  });
}
// code unique et simple : ODA-001, ODA-002...
function prochainCode(){
  const n=items.map(p=>{const m=/^ODA-(\d+)$/i.exec(p.code||'');return m?parseInt(m[1],10):0});
  return 'ODA-'+String((n.length?Math.max(...n):0)+1).padStart(3,'0');
}
$('fok').onclick=async()=>{
  const nom=$('fnom').value.trim(),sec=$('fsec').value,S=SECTIONS.find(s=>s.k===sec),pv=$('fvente').value.trim(),vente=pv===''?0:parseFloat(pv);
  if(!nom){$('fmsg').textContent='Remplis le premier champ.';return}
  if(S.vid&&!$('ftyp').value){$('fmsg').textContent="Choisis le type : terrain à acheter ou maison à louer.";return}
  if(S.prix&&!(vente>0)){$('fmsg').textContent='Écris le prix de vente.';return}
  if(!(vente>=0)){$('fmsg').textContent='Prix invalide.';return}
  $('fok').disabled=true;$('fmsg').textContent='Enregistrement...';
  try{
    let video='';const urls=[];
    for(let i=0;i<photoList.length;i++){const x=photoList[i];urls.push(x.url||await envoyer(x.blob,'image/jpeg','Envoi photo '+(i+1)+'/'+photoList.length))}
    const photo=urls[0]||'';
    if(videoFile&&S.vid)video=await envoyer(videoFile,videoFile.type||'video/mp4','Envoi de la vidéo');
    if(edit){ // modification : on ne change la photo/vidéo que si une nouvelle a été choisie
      const ch={name:nom,description:$('fdesc').value.trim()||null,price:vente,sell_price:vente,seller_name:$('fven').value.trim(),seller_phone:$('ftel').value.trim(),section:sec,sous_categorie:S.vid?$('ftyp').value:null};
      ch.photo=photo;ch.image_url=photo||null;ch.photos=urls;if(video)ch.video_url=video;
      const res=await api('/rest/v1/products?id=eq.'+encodeURIComponent(edit.id),{method:'PATCH',headers:H({'Content-Type':'application/json',Prefer:'return=representation'}),body:JSON.stringify(ch)});
      Object.assign(edit,(res&&res[0])||ch);tab=sec;afficher();$('fs').hidden=true;toast('✅ '+(edit.code||'Annonce')+' modifiée');
    }else{
    const code=prochainCode();
    const row={name:nom,description:$('fdesc').value.trim()||null,price:vente,sell_price:vente,buy_price:0,photo:photo,image_url:photo||null,photos:urls,video_url:video||null,
      seller_name:$('fven').value.trim(),seller_phone:$('ftel').value.trim(),code,section:sec,sous_categorie:S.vid?$('ftyp').value:null,region:'agadez',status:'En stock',quantite:1,stock:100};
    const res=await api('/rest/v1/products',{method:'POST',headers:H({'Content-Type':'application/json',Prefer:'return=representation'}),body:JSON.stringify(row)});
    items.unshift((res&&res[0])||row);tab=sec;$('q').value='';afficher();$('fs').hidden=true;toast('✅ '+code+' ajouté');
    }
  }catch(err){$('fmsg').textContent='⚠️ '+err.message;if(/connecte-toi/i.test(err.message)){$('fs').hidden=true;ouvrirLogin()}}
  $('fok').disabled=false;$('bar').hidden=true;
};

// ===== Connexion administrateur =====
function ouvrirLogin(){$('lmsg').textContent='';$('ls').hidden=false}
$('lg').onclick=()=>{
  if(tok){tok=null;mail='';try{localStorage.removeItem('oda_admin')}catch(e){}head();charger();toast('Déconnecté');return}
  ouvrirLogin();
};
$('out').onclick=()=>$('lg').click();
$('lno').onclick=()=>$('ls').hidden=true;
$('lok').onclick=async()=>{
  $('lok').disabled=true;$('lmsg').textContent='Connexion...';
  try{
    const r=await api('/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify({email:$('lmail').value.trim(),password:$('lpass').value})});
    tok=r.access_token;mail=(r.user&&r.user.email)||$('lmail').value.trim();
    try{localStorage.setItem('oda_admin',JSON.stringify({tok,mail,exp:Date.now()+(r.expires_in||3600)*1000-60000}))}catch(e){}
    $('ls').hidden=true;$('lpass').value='';head();charger();toast('✅ Connecté');
  }catch(err){$('lmsg').textContent=/refusé|invalid|Erreur 400/i.test(err.message)?'E-mail ou mot de passe incorrect.':'⚠️ '+err.message}
  $('lok').disabled=false;
};
head();charger();if(!tok)ouvrirLogin();
</script>
